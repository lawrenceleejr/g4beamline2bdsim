name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest numpy
      - name: Unit tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          g4beamline2bdsim examples/fodo.g4bl -o /tmp/fodo.gmad
          test -s /tmp/fodo.gmad
